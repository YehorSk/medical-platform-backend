services:
  mailpit:
    image: axllent/mailpit
    environment:
      - TZ=Europe/Bratislava
    networks:
      - medical_platform_network
    container_name: mailpit-medical-platform
    volumes:
      - mailpit-medical-platform-data:/data
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - TZ=Europe/Bratislava
    command: server /data --address ":9100" --console-address ":9101"
    networks:
      - medical_platform_network
    container_name: minio-medical-platform
    volumes:
      - minio-medical-platform-data:/data
    ports:
      - "9100:9100"
      - "9101:9101"

  postgres:
    image: postgres:latest
    container_name: medical-platform-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medical_platform
    networks:
      - medical_platform_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis-medical-platform
    networks:
      - medical_platform_network
    ports:
      - "6379:6379"
    volumes:
      - redis-medical-platform-data:/data
    command: redis-server --appendonly yes

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight-medical-platform
    environment:
      - TZ=Europe/Bratislava
    networks:
      - medical_platform_network
    depends_on:
      - redis
    volumes:
      - redisinsight-medical-platform-data:/data
    ports:
      - "5540:5540"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-medical-platform
    networks:
      - medical_platform_network
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq-medical-platform-data:/var/lib/rabbitmq

volumes:
  postgres_data:
  mailpit-medical-platform-data:
  minio-medical-platform-data:
  redis-medical-platform-data:
  redisinsight-medical-platform-data:
  rabbitmq-medical-platform-data:

networks:
  medical_platform_network:
    driver: bridge