services:
  mailpit:
    image: axllent/mailpit
    environment:
      - TZ=Europe/Bratislava
    networks:
      - medical_platform_network
    container_name: mailpit-medical-platform
    volumes:
      - mailpit-medical-platform-data:/data
    ports:
      - "8025:8025"
      - "1025:1025"

  # S3-compatible storage (MinIO replacement). API on 9100, web console on 9101.
  s3:
    image: rustfs/rustfs:1.0.6
    container_name: s3-medical-platform
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_ADDRESS=:9100
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9101
      - TZ=Europe/Bratislava
    networks:
      - medical_platform_network
    volumes:
      - s3-medical-platform-data:/data
    ports:
      - "9100:9100"
      - "9101:9101"

  # One-shot job: creates the buckets the app expects, then exits.
  s3-init:
    image: amazon/aws-cli:2.22.0
    container_name: s3-init-medical-platform
    depends_on:
      - s3
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - medical_platform_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do aws --endpoint-url http://s3:9100 s3 ls >/dev/null 2>&1 && break; sleep 1; done
        for b in quarantine medical-files; do
          aws --endpoint-url http://s3:9100 s3 mb s3://$$b 2>/dev/null || echo "bucket $$b already exists"
        done
        aws --endpoint-url http://s3:9100 s3 ls
    restart: "no"

  postgres:
    image: postgres:latest
    container_name: medical-platform-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medical_platform
    networks:
      - medical_platform_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: redis-medical-platform
    networks:
      - medical_platform_network
    ports:
      - "6379:6379"
    volumes:
      - redis-medical-platform-data:/data
    command: redis-server --appendonly yes

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight-medical-platform
    environment:
      - TZ=Europe/Bratislava
    networks:
      - medical_platform_network
    depends_on:
      - redis
    volumes:
      - redisinsight-medical-platform-data:/data
    ports:
      - "5540:5540"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-medical-platform
    networks:
      - medical_platform_network
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq-medical-platform-data:/var/lib/rabbitmq

  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    restart: unless-stopped
    volumes:
      - clamav-medical-platform-data:/var/lib/clamav
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    networks:
      - medical_platform_network
    ports:
      - "3310:3310"
    healthcheck:
      test: [ "CMD", "/usr/local/bin/clamdcheck.sh" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  postgres_data:
  mailpit-medical-platform-data:
  s3-medical-platform-data:
  redis-medical-platform-data:
  redisinsight-medical-platform-data:
  rabbitmq-medical-platform-data:
  clamav-medical-platform-data:

networks:
  medical_platform_network:
    driver: bridge