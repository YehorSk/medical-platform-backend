spring.application.name=medical-platform-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/medical_platform
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.json.mapper=jackson

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET_BASE64}
jwt.expiration-minutes = 15

minio.accessKey = minioadmin
minio.secretKey = minioadmin
minio.endpoint = http://minio-medical-platform:9100
minio.region = us-east-1
minio.buckets.quarantine = quarantine
minio.buckets.medical-files = medical-files

firebase.credentials-path=classpath:medicalplatform-a579e-firebase-adminsdk-fbsvc-49d6963eaa.json

spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.from=info@med-platform.sk

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.messages.basename=lang/messages

logging.level.root=INFO
logging.level.com.yehorsk.medicalplatformbackend=DEBUG

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=password

medical-platform.rate-limit.ip.apply-limit=true

medical-platform.web-socket.allowed-origins=http://localhost:5173,http://localhost:8080,http://10.10.7.45:8080,http://192.168.1.18:8080